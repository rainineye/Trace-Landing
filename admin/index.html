<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trace · Admin</title>
  <style>
    :root {
      --paper: #FAF8F3;
      --paper-deep: #F2EEE4;
      --ink: #1A1A1A;
      --ink-soft: #5A5147;
      --ink-mute: #9D968B;
      --primary: #A03A2C;
      --good: #2F6B3A;
      --rule: #D9D4C7;
      --rule-soft: #E8E3D6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 40px 24px 80px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 16px; margin-bottom: 32px;
      border-bottom: 1px solid var(--rule);
    }
    .dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; }
    .brand { font-family: "Fraunces", Georgia, serif; font-size: 20px; font-weight: 500; letter-spacing: -0.3px; }
    .tag {
      margin-left: auto;
      font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
      font-size: 10px; color: var(--ink-mute); letter-spacing: 1px; text-transform: uppercase;
    }

    h1 { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-weight: 400; margin: 0 0 6px; letter-spacing: -0.3px; }
    .sub { color: var(--ink-soft); margin: 0 0 28px; font-size: 13.5px; }
    section { margin-bottom: 40px; }
    section h2 {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--ink-mute); margin: 0 0 12px; font-weight: 500;
    }
    table { width: 100%; border-collapse: collapse; background: var(--paper); }
    th, td {
      text-align: left; padding: 10px 12px; vertical-align: middle;
      border-bottom: 1px solid var(--rule-soft); font-size: 13px;
    }
    th {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10.5px; color: var(--ink-mute); letter-spacing: 0.6px; text-transform: uppercase;
      font-weight: 500; border-bottom: 1px solid var(--rule);
    }
    td.mono, td .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .pill {
      display: inline-block; padding: 2px 7px; border-radius: 999px;
      font-family: ui-monospace, Menlo, monospace; font-size: 10px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .pill.requested { background: #fdf2c7; color: #7a5b0d; }
    .pill.approved  { background: #dceadd; color: #2c5a36; }
    .pill.rejected  { background: #efd6d3; color: #762b1f; }
    .pill.redeemed  { background: #d4ddef; color: #1f3a76; }

    /* ---- dashboard: funnel cards + activity chart ---- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 1px; background: var(--rule);
      border: 1px solid var(--rule); margin-bottom: 16px;
    }
    .stat { background: var(--paper); padding: 14px 16px 12px; }
    .stat .n { font-family: "Fraunces", Georgia, serif; font-size: 28px; line-height: 1.05; letter-spacing: -0.5px; }
    .stat .l {
      font-family: ui-monospace, Menlo, monospace; font-size: 10px;
      letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-mute); margin-top: 6px;
    }
    .stat .d { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
    .stat .d.warn { color: var(--primary); }

    .chart-box { border: 1px solid var(--rule); background: var(--paper); padding: 14px 16px 10px; margin-bottom: 16px; }
    .chart {
      display: flex; align-items: flex-end; gap: 5px;
      height: 84px; border-bottom: 1px solid var(--rule-soft); padding-bottom: 1px;
    }
    .chart .day { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 100%; }
    .chart .bar { width: 42%; min-height: 2px; background: var(--rule); }
    .chart .bar.appr { background: var(--good); }
    .chart .bar.zero { background: transparent; border-bottom: 2px solid var(--rule-soft); }
    .chart-x {
      display: flex; gap: 5px; margin-top: 5px;
      font-family: ui-monospace, Menlo, monospace; font-size: 9px; color: var(--ink-mute);
    }
    .chart-x span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
    .legend {
      display: flex; gap: 14px; margin-top: 8px;
      font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--ink-soft);
    }
    .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }
    .legend .sw-req  i { background: var(--rule); }
    .legend .sw-appr i { background: var(--good); }

    button {
      font-family: ui-monospace, Menlo, monospace; font-size: 11px;
      letter-spacing: 0.5px; text-transform: uppercase;
      padding: 6px 10px; border-radius: 2px; border: 1px solid var(--rule);
      background: var(--paper-deep); color: var(--ink); cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    button:hover:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    button.primary:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); }
    button.danger:hover:not(:disabled)  { background: var(--primary); border-color: var(--primary); color: var(--paper); }
    button:disabled { opacity: .45; cursor: default; }
    button + button { margin-left: 6px; }

    /* icon-only buttons (copy / send email) */
    button.icon {
      padding: 5px 6px; line-height: 0;
      border: 1px solid transparent; background: transparent;
      color: var(--ink-soft); border-radius: 2px;
    }
    button.icon:hover:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    button.icon svg { width: 15px; height: 15px; display: block; }
    button.icon.sent { color: var(--good); }
    button.icon.sent:hover:not(:disabled) { background: var(--good); border-color: var(--good); color: var(--paper); }
    .codecell { display: inline-flex; align-items: center; gap: 4px; }

    .empty {
      padding: 24px 0; color: var(--ink-mute);
      font-style: italic; font-size: 13.5px;
    }

    .gate {
      max-width: 380px; margin: 80px auto 0;
      padding: 28px; border: 1px solid var(--rule); background: var(--paper-deep);
      border-radius: 4px;
    }
    .gate h1 { font-size: 18px; margin-bottom: 14px; }
    .gate label {
      display: block; font-family: ui-monospace, Menlo, monospace; font-size: 10px;
      color: var(--ink-mute); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px;
    }
    .gate input {
      width: 100%; padding: 10px 12px; font-family: ui-monospace, Menlo, monospace;
      font-size: 13px; border: 1px solid var(--rule); border-radius: 2px;
      background: var(--paper); color: var(--ink); outline: none;
    }
    .gate input:focus { border-color: var(--ink); }
    .gate button { width: 100%; margin-top: 16px; padding: 10px 12px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--paper); padding: 10px 16px;
      font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; letter-spacing: 0.5px;
      border-radius: 2px; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .err { color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap" id="appRoot"><!-- populated by JS --></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const $ = (sel, root) => (root || document).querySelector(sel);
      const root = $("#appRoot");
      const toastEl = $("#toast");
      let toastTimer;
      const toast = (msg, isErr) => {
        toastEl.textContent = msg;
        toastEl.classList.toggle("err", !!isErr);
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
      };

      // ---- token from URL or sessionStorage ---------------------------------
      const url = new URL(location.href);
      let token = url.searchParams.get("token") || sessionStorage.getItem("trace_admin_token") || "";

      function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign(
          { "Content-Type": "application/json" },
          opts.headers || {},
          { "Authorization": "Bearer " + token }
        );
        return fetch(path, opts).then(async (r) => {
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status, data });
          return data;
        });
      }

      // ---- gate (token entry) -----------------------------------------------
      function renderGate(message) {
        root.innerHTML = `
          <div class="gate">
            <h1>Admin access</h1>
            <label>Token</label>
            <input id="tokenInput" type="password" autocomplete="off" spellcheck="false"
                   placeholder="paste ADMIN_TOKEN" />
            <button class="primary" id="tokenSubmit">Enter</button>
            <div class="empty" id="gateMsg" style="padding-top:14px">${message || ""}</div>
          </div>
        `;
        const inp = $("#tokenInput");
        inp.focus();
        const go = () => {
          const v = inp.value.trim();
          if (!v) return;
          token = v;
          sessionStorage.setItem("trace_admin_token", token);
          // Reflect in URL so bookmarking works (private profiles only).
          url.searchParams.set("token", token);
          history.replaceState({}, "", url.toString());
          load();
        };
        $("#tokenSubmit").onclick = go;
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      }

      // ---- main render ------------------------------------------------------
      function fmtDate(s) {
        if (!s) return "—";
        const d = new Date(s);
        if (isNaN(+d)) return s;
        return d.toLocaleString();
      }
      function pill(status, redeemed) {
        if (redeemed && status === "approved") return `<span class="pill redeemed">redeemed</span>`;
        return `<span class="pill ${status}">${status}</span>`;
      }

      const ICONS = {
        copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
        send: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>`,
        sent: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13l4 4L14 9"/><path d="M10 17l2 2L22 9"/></svg>`,
      };

      // ---- funnel stats + 14-day activity chart -----------------------------
      function pct(part, whole) {
        if (!whole) return "—";
        return Math.round((part / whole) * 100) + "%";
      }

      function renderStats(rows) {
        const total    = rows.length;
        const pending  = rows.filter((r) => r.status === "requested").length;
        const approved = rows.filter((r) => r.status === "approved");
        const emailed  = approved.filter((r) => r.email_sent_at).length;
        const notEmailed = approved.length - emailed;
        const redeemed = approved.filter((r) => r.redeemed_at).length;
        const visited  = approved.filter((r) => (r.demo_visits || 0) > 0).length;
        const visits   = approved.reduce((s, r) => s + (r.demo_visits || 0), 0);

        return `
          <div class="stats">
            <div class="stat">
              <div class="n">${total}</div>
              <div class="l">Signups</div>
              <div class="d">${pending} awaiting review</div>
            </div>
            <div class="stat">
              <div class="n">${approved.length}</div>
              <div class="l">Approved</div>
              <div class="d">${pct(approved.length, total)} of signups</div>
            </div>
            <div class="stat">
              <div class="n">${emailed}</div>
              <div class="l">Code emailed</div>
              <div class="d ${notEmailed > 0 ? "warn" : ""}">${
                notEmailed > 0 ? notEmailed + " approved, not emailed" : "all approved notified"
              }</div>
            </div>
            <div class="stat">
              <div class="n">${redeemed}</div>
              <div class="l">Logged in</div>
              <div class="d">${pct(redeemed, approved.length)} of approved</div>
            </div>
            <div class="stat">
              <div class="n">${visited}</div>
              <div class="l">Visited demo</div>
              <div class="d">${visits} visit${visits === 1 ? "" : "s"} total</div>
            </div>
          </div>
        `;
      }

      function renderChart(rows) {
        const DAYS = 14;
        const days = [];
        const now = new Date();
        for (let i = DAYS - 1; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
          days.push({
            key: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"),
            label: (d.getMonth() + 1) + "/" + d.getDate(),
            req: 0, appr: 0,
          });
        }
        const byKey = {};
        days.forEach((d) => { byKey[d.key] = d; });
        const localKey = (s) => {
          const d = new Date(s);
          if (isNaN(+d)) return null;
          return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        };
        rows.forEach((r) => {
          const ck = r.created_at  && localKey(r.created_at);
          const ak = r.approved_at && localKey(r.approved_at);
          if (ck && byKey[ck]) byKey[ck].req++;
          if (ak && byKey[ak]) byKey[ak].appr++;
        });

        const max = Math.max(1, ...days.map((d) => Math.max(d.req, d.appr)));
        const h = (n) => Math.round((n / max) * 100);

        return `
          <div class="chart-box">
            <h2 style="margin-bottom:10px">Last ${DAYS} days</h2>
            <div class="chart">
              ${days.map((d) => `
                <div class="day" title="${d.label} · ${d.req} signup${d.req === 1 ? "" : "s"}, ${d.appr} approved">
                  <span class="bar ${d.req === 0 ? "zero" : ""}" style="height:${h(d.req)}%"></span>
                  <span class="bar appr ${d.appr === 0 ? "zero" : ""}" style="height:${h(d.appr)}%"></span>
                </div>
              `).join("")}
            </div>
            <div class="chart-x">${days.map((d, i) => `<span>${i % 2 === 0 ? d.label : ""}</span>`).join("")}</div>
            <div class="legend">
              <span class="sw-req"><i></i>Signups</span>
              <span class="sw-appr"><i></i>Approved</span>
            </div>
          </div>
        `;
      }

      function renderDashboard(rows) {
        const pending  = rows.filter((r) => r.status === "requested");
        const approved = rows.filter((r) => r.status === "approved");
        const other    = rows.filter((r) => r.status !== "requested" && r.status !== "approved");

        root.innerHTML = `
          <header>
            <span class="dot"></span>
            <span class="brand">Trace</span>
            <span class="tag">Admin · invites</span>
          </header>

          <h1>Invite review</h1>
          <p class="sub">
            Pending requests show up below. Click <em>Approve</em> — the code is emailed
            automatically (and copied to your clipboard as backup).
          </p>

          ${renderStats(rows)}
          ${renderChart(rows)}

          <section>
            <h2>Pending · ${pending.length}</h2>
            ${pending.length === 0
              ? `<div class="empty">No pending requests.</div>`
              : `<table>
                  <thead><tr>
                    <th style="width: 36%">Email</th>
                    <th>Requested</th>
                    <th>Status</th>
                    <th style="text-align:right">Actions</th>
                  </tr></thead>
                  <tbody>
                    ${pending.map((r) => `
                      <tr data-email="${escapeHtml(r.email)}">
                        <td class="mono">${escapeHtml(r.email)}</td>
                        <td>${fmtDate(r.created_at)}</td>
                        <td>${pill(r.status, !!r.redeemed_at)}</td>
                        <td style="text-align:right">
                          <button class="primary" data-act="approve">Approve</button>
                          <button class="danger"  data-act="reject">Reject</button>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>`
            }
          </section>

          <section>
            <h2>Approved · ${approved.length}</h2>
            ${approved.length === 0
              ? `<div class="empty">No approved invites yet.</div>`
              : `<table>
                  <thead><tr>
                    <th style="width: 26%">Email</th>
                    <th>Code</th>
                    <th>Approved</th>
                    <th>Code emailed</th>
                    <th>Logged in</th>
                    <th>Visits</th>
                    <th>Status</th>
                    <th style="text-align:right">Actions</th>
                  </tr></thead>
                  <tbody>
                    ${approved.map((r) => `
                      <tr data-email="${escapeHtml(r.email)}">
                        <td class="mono">${escapeHtml(r.email)}</td>
                        <td>
                          <span class="codecell">
                            <span class="mono">${escapeHtml(r.code || "—")}</span>
                            <button class="icon" data-act="copy" data-code="${escapeHtml(r.code || "")}" title="Copy code" aria-label="Copy code">${ICONS.copy}</button>
                          </span>
                        </td>
                        <td>${fmtDate(r.approved_at)}</td>
                        <td>${r.email_sent_at ? fmtDate(r.email_sent_at) : `<span class="err">not sent</span>`}</td>
                        <td>${fmtDate(r.redeemed_at)}</td>
                        <td>${r.demo_visits || 0}</td>
                        <td>${pill(r.status, !!r.redeemed_at)}</td>
                        <td style="text-align:right">
                          <button class="icon ${r.email_sent_at ? "sent" : ""}" data-act="email"
                            title="${r.email_sent_at ? "Emailed " + escapeHtml(fmtDate(r.email_sent_at)) + " — click to resend" : "Email code to requester"}"
                            aria-label="${r.email_sent_at ? "Resend code email" : "Send code email"}">
                            ${r.email_sent_at ? ICONS.sent : ICONS.send}
                          </button>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>`
            }
          </section>

          ${other.length === 0 ? "" : `
          <section>
            <h2>Other · ${other.length}</h2>
            <table>
              <thead><tr>
                <th style="width: 36%">Email</th>
                <th>Status</th>
                <th>Created</th>
              </tr></thead>
              <tbody>
                ${other.map((r) => `
                  <tr>
                    <td class="mono">${escapeHtml(r.email)}</td>
                    <td>${pill(r.status, false)}</td>
                    <td>${fmtDate(r.created_at)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>
          `}
        `;

        root.querySelectorAll("button[data-act]").forEach((btn) => {
          btn.addEventListener("click", onAction);
        });
      }

      async function onAction(ev) {
        const btn = ev.currentTarget;
        const tr = btn.closest("tr");
        const email = tr && tr.dataset.email;
        const act = btn.dataset.act;
        if (!email || !act) return;

        if (act === "copy") {
          const code = btn.dataset.code || "";
          if (code) {
            try {
              await navigator.clipboard.writeText(code);
              toast("Code copied to clipboard");
            } catch {
              toast("Copy failed — select & copy manually", true);
            }
          }
          return;
        }

        if (act === "approve") {
          if (!confirm(`Approve ${email}?\nA code will be activated for them.`)) return;
          btn.disabled = true;
          try {
            const data = await api("/api/admin/approve", {
              method: "POST",
              body: JSON.stringify({ email }),
            });
            const code = data.code;
            // email_sent: true = Resend accepted it, false = send failed,
            // null/undefined = no RESEND_API_KEY — email them the code yourself.
            const mail =
              data.email_sent === true  ? " · email sent" :
              data.email_sent === false ? " · EMAIL FAILED — send manually" :
                                          " · no email configured — send manually";
            try {
              await navigator.clipboard.writeText(code);
              toast(`Approved · code ${code} copied${mail}`, data.email_sent === false);
            } catch {
              toast(`Approved · code: ${code}${mail}`, data.email_sent === false);
            }
            await load();
          } catch (err) {
            toast("Approve failed: " + (err.message || "error"), true);
            btn.disabled = false;
          }
          return;
        }

        if (act === "email") {
          // Re-sending is deliberate; first send is one click.
          if (btn.classList.contains("sent") && !confirm(`Resend the code email to ${email}?`)) return;
          btn.disabled = true;
          try {
            await api("/api/admin/resend-email", {
              method: "POST",
              body: JSON.stringify({ email }),
            });
            toast(`Code emailed to ${email}`);
            await load();
          } catch (err) {
            const reason =
              err.data && err.data.error === "email_not_configured" ? "RESEND_API_KEY not set" :
              err.data && err.data.error === "send_failed"          ? "Resend rejected the send" :
              (err.message || "error");
            toast("Email failed: " + reason, true);
            btn.disabled = false;
          }
          return;
        }

        if (act === "reject") {
          if (!confirm(`Reject ${email}? They won't be able to redeem.`)) return;
          btn.disabled = true;
          try {
            await api("/api/admin/reject", {
              method: "POST",
              body: JSON.stringify({ email }),
            });
            toast(`${email} rejected`);
            await load();
          } catch (err) {
            toast("Reject failed: " + (err.message || "error"), true);
            btn.disabled = false;
          }
          return;
        }
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      // ---- bootstrap --------------------------------------------------------
      async function load() {
        if (!token) return renderGate();
        try {
          const data = await api("/api/admin/list-all");
          renderDashboard(data.rows || []);
        } catch (err) {
          if (err.status === 401) {
            sessionStorage.removeItem("trace_admin_token");
            token = "";
            renderGate("Token rejected. Try again.");
          } else if (err.status === 503) {
            root.innerHTML = `<div class="empty">Admin is disabled — set <code>ADMIN_TOKEN</code> as a worker secret first.</div>`;
          } else {
            root.innerHTML = `<div class="empty err">Load failed: ${escapeHtml(err.message || "error")}</div>`;
          }
        }
      }

      load();
    })();
  </script>
</body>
</html>
